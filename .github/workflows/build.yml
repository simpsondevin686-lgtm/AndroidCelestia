name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch CelestiaSourceCode
        uses: actions/checkout@v4
        with:
          repository: simpsondevin686-lgtm/CelestiaSourceCode
          path: CelestiaSourceCode
          ref: develop

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Setup Required Build Paths & Placeholders
        run: |
          ln -s "$GITHUB_WORKSPACE/CelestiaSourceCode" "$GITHUB_WORKSPACE/../Celestia"
          ln -s "$GITHUB_WORKSPACE/CelestiaSourceCode" "$GITHUB_WORKSPACE/../CelestiaContent"
          mkdir -p "$GITHUB_WORKSPACE/../CelestiaLocalization/android"
          touch "$GITHUB_WORKSPACE/../CelestiaLocalization/android/placeholder.po"
          mkdir -p app
          echo '{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"org.celestiaproject.celestia"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew assembleFossDebug
