name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AndroidCelestia
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout CelestiaSourceCode
        uses: actions/checkout@v4
        with:
          repository: simpsondevin686-lgtm/CelestiaSourceCode
          path: app/src/main/jni/celestia  # Adjust destination path if needed
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Mobile Debug APK
        run: ./gradlew assembleMobileDebug
