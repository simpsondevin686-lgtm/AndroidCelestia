name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AndroidCelestia
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch CelestiaSourceCode
        uses: actions/checkout@v4
        with:
          repository: simpsondevin686-lgtm/CelestiaSourceCode
          path: ../Celestia
          ref: develop

      - name: Fetch CelestiaLocalization
        uses: actions/checkout@v4
        with:
          repository: celestiamobile/CelestiaLocalization
          path: ../CelestiaLocalization
          ref: master

      - name: Setup Local Content Link
        run: |
          ln -s "$GITHUB_WORKSPACE/../Celestia" "$GITHUB_WORKSPACE/../CelestiaContent"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew assembleDebug
