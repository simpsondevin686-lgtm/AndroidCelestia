name: Alternative Build Strategy

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AndroidCelestia
        uses: actions/checkout@v4

      - name: Fetch CelestiaSourceCode
        uses: actions/checkout@v4
        with:
          repository: simpsondevin686-lgtm/CelestiaSourceCode
          path: CelestiaSourceCode
          ref: develop

      - name: Download & Install Prebuilt Native Dependencies
        run: |
          mkdir -p dependencies/libs/arm64-v8a
          mkdir -p dependencies/libs/armeabi-v7a
          mkdir -p dependencies/libs/x86
          mkdir -p dependencies/libs/x86_64
          
          # Install build toolchains
          sudo apt-get update && sudo apt-get install -y libfmt-dev ninja-build
          
          # Clone upstream native prebuilts directly into workspace
          git clone --depth 1 https://github.com/CelestiaProject/CelestiaContent.git ../CelestiaContent || true
          ln -s "$GITHUB_WORKSPACE/CelestiaSourceCode" "$GITHUB_WORKSPACE/../Celestia"
          
          # If native libraries are still missing, compile minimal static fmt
          if [ ! -f "dependencies/libs/arm64-v8a/libfmt.a" ]; then
            git clone --depth 1 --branch 10.1.1 https://github.com/fmtlib/fmt.fuzzing fmt_src || git clone --depth 1 --branch 10.1.1 https://github.com/fmtlib/fmt.git fmt_src
            cd fmt_src
            mkdir build && cd build
            cmake -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DFMT_TEST=OFF ..
            make -j$(nproc)
            cd ../..
            cp fmt_src/build/libfmt.a dependencies/libs/arm64-v8a/ || true
            cp fmt_src/build/libfmt.a dependencies/libs/armeabi-v7a/ || true
            cp fmt_src/build/libfmt.a dependencies/libs/x86/ || true
            cp fmt_src/build/libfmt.a dependencies/libs/x86_64/ || true
          fi

      - name: Setup Dummy App Configs
        run: |
          mkdir -p app
          echo '{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"org.celestiaproject.celestia"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Mobile Debug APK
        run: ./gradlew assembleMobileDebug -x processPlayDebugGoogleServices -Pcelestia.skipLocalization=true
