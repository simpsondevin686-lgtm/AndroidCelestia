name: Build Android Celestia APK

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Wrapper
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Celestia Core Source
        uses: actions/checkout@v4
        with:
          repository: simpsondevin686-lgtm/CelestiaSourceCode
          path: Celestia/src/main/cpp
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android NDK & CMake
        uses: nkmrshn/setup-android-sdk@v1

      - name: Install Host Tools & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libgettextpo-dev ninja-build pkg-config libepoxy-dev

      - name: Build Mobile Debug APK
        run: ./gradlew assembleMobileDebug -Pandroid.injected.build.args="-DENABLE_GETTEXT=OFF -DENABLE_EGL=ON -DENABLE_GLESv3=ON"
